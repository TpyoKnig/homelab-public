# Grafana provisioning — /opt/obs/grafana/provisioning/dashboards/dashboards.yaml
#
# Mount into the Grafana container at
# /etc/grafana/provisioning/dashboards/, and put the dashboard JSON files in
# /mnt/data/grafana/dashboards (bind-mounted to the path below).
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    type: file
    disableDeletion: false
    # Picks up file edits without a Grafana restart.
    updateIntervalSeconds: 30
    # Lets you rearrange panels in the UI. Changes are LOST on the next file
    # reload — treat the JSON as the source of truth and export back to it.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

# ── The dashboards themselves ────────────────────────────────────────────────
# Vendored in dashboards/ — copy that directory to the path above and
# they load within updateIntervalSeconds. No import step and no clicking, which
# also means no chance of pointing one at the wrong datasource by hand.
#
# | File                                   | ID    | Reads from | Notes
# |----------------------------------------|-------|------------|----------------------
# | n8n-system-health-overview-*           | 24474 | Prometheus | Node.js runtime: heap, GC, event loop
# | n8n-workflow-execution-analytics       | 24475 | Postgres   | Follows the n8n-postgres datasource
# | node-exporter-full                     | 1860  | Prometheus | Per-node CPU/mem/disk/net/temps
# | kubernetes-views-global                | 15757 | Prometheus | Needs the `cluster` label
# | kubernetes-views-nodes                 | 15759 | Prometheus | "
# | kubernetes-views-pods                  | 15760 | Prometheus | Restarts, CPU throttling, OOMs
# | n8n-on-talos                           | —     | Prom+Loki  | Original, not from grafana.com
# | n8n-full-observability                 | —     | Prometheus | Original. 30 panels over every metric
# |                                        |       |            | group n8n can emit; needs the 19
# |                                        |       |            | N8N_METRICS_INCLUDE_* flags on
#
# Attribution, the two gotchas that make the Kubernetes dashboards render, and
# why the datasource UIDs in these files were rewritten: dashboards/README.md.
#
# Community dashboards remain under their authors' terms — vendored for
# reproducibility, not relicensed.
