# Grafana provisioning — /opt/obs/grafana/provisioning/dashboards/dashboards.yaml
#
# Mount into the Grafana container at
# /etc/grafana/provisioning/dashboards/, and put the dashboard JSON files in
# /mnt/data/grafana/dashboards (bind-mounted to the path below).
apiVersion: 1

providers:
  - name: homelab
    orgId: 1
    type: file
    disableDeletion: false
    # Picks up file edits without a Grafana restart.
    updateIntervalSeconds: 30
    # Lets you rearrange panels in the UI. Changes are LOST on the next file
    # reload — treat the JSON as the source of truth and export back to it.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true

# ── The dashboards themselves ────────────────────────────────────────────────
# Not vendored here: community dashboard JSON is large, versioned upstream, and
# licensed by its authors. Fetch by ID and drop the JSON into the path above.
#
#   curl -s https://grafana.com/api/dashboards/<ID>/revisions/latest/download \
#     -o /mnt/data/grafana/dashboards/<name>.json
#
# | ID    | Dashboard                          | Reads from     | Notes
# |-------|------------------------------------|----------------|---------------------------
# | 24474 | n8n System Health Overview         | Prometheus     | Node.js runtime: heap, GC, event loop
# | 24475 | n8n Workflow & Execution Analytics | Postgres       | Needs the n8n-postgres datasource
# | 1860  | Node Exporter Full                 | Prometheus     | Per-node CPU/mem/disk/net/temps
# | 15757 | Kubernetes / Views / Global        | Prometheus     | Needs the `cluster` label (see below)
# | 15759 | Kubernetes / Views / Nodes         | Prometheus     | "
# | 15760 | Kubernetes / Views / Pods          | Prometheus     | Restarts, CPU throttling, OOMs
#
# TWO THINGS THAT MAKE THESE WORK, both easy to miss:
#
# 1. The `cluster` label. Every 157xx dashboard filters on {cluster="$cluster"}
#    and renders completely empty without it. The scrape config injects it with
#    a static relabel — see docs/06-ops-host.md. Nothing warns you; the panels
#    just say "No data".
#
# 2. The kubelet cadvisor job. The pod-level CPU/memory panels read container_*
#    and machine_* series, which come from /metrics/cadvisor on the kubelet, NOT
#    from node-exporter or kube-state-metrics. Miss that scrape job and the
#    dashboards load, most panels populate, and only the per-pod ones are blank —
#    which reads as a broken dashboard rather than a missing target.
#
# After importing, set each dashboard's datasource variable. Community
# dashboards ship pointing at whatever UID their author used.
#
# ── Custom dashboards ────────────────────────────────────────────────────────
# Export your own with Share → Export → "Export for sharing externally", which
# replaces the hardcoded datasource UID with a __inputs variable. Save the JSON
# into the provisioning path and it survives a Grafana rebuild.
