# Template. Copy to secrets.sops.yaml, fill in real values, then encrypt in
# place with `sops -e -i secrets.sops.yaml` BEFORE committing.
#
# The .sops.yaml creation rules encrypt only `data` / `stringData`, so `name`,
# `namespace` and `kind` stay readable and git diffs remain meaningful.
#
# Three credentials, one Secret:
#
#   GITEA__PERSONAL_ACCESS_TOKEN Forgejo PAT. Scope it: write:repository, write:issue,
#                         read:user. Not an admin token — this thing reads and
#                         comments on every repo it is pointed at.
#
#   GITEA__WEBHOOK_SECRET The sha256 HMAC. Shared between THIS secret and every
#                         Forgejo webhook. Rotating means editing both sides
#                         together, or every delivery 401s at the signature
#                         check. It is also the only thing authenticating the
#                         receiver, since there is no TLS and no ingress.
#
#   ANTHROPIC__KEY        Model API key. Match the provider to CONFIG__MODEL in
#                         pr-agent.yaml.
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: pr-agent-secrets
  namespace: pr-agent
spec:
  secretTemplates:
    - name: pr-agent-secrets
      stringData:
        GITEA__PERSONAL_ACCESS_TOKEN: <FORGEJO_PAT>
        GITEA__WEBHOOK_SECRET: <openssl rand -hex 32>
        ANTHROPIC__KEY: <MODEL_API_KEY>
