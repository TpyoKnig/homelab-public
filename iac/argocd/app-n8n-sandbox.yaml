# n8n-sandbox-service — isolated code execution for the n8n AI Assistant.
#
# Chart source is the upstream repo at a COMMIT. n8n maintains the service at
# n8n-io/n8n-sandbox-service; the chart is vendored at charts/n8n-sandbox-service
# and is NOT published to a Helm repo or as an OCI artifact, so pin a commit (or
# a tag once upstream tags chart releases). This commit is the chart 0.4.0 merge
# (PR #126), the first release with privileged isolation for immutable-rootfs
# distros like Talos.
#
# Same two-source shape as every other app here: chart from upstream, values from
# git. Bumping the service = bump targetRevision.
#
# Sync-wave 1: after cert-manager (the mTLS Certificates need an Issuer) and
# before n8n, which points N8N_SANDBOX_SERVICE_URL at it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n-sandbox
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: n8n-sandbox
  sources:
    - repoURL: https://github.com/n8n-io/n8n-sandbox-service.git
      targetRevision: 2a5af87727cb4055622623bc1f0ce62db4e9a776  # chart 0.4.0 (PR #126)
      path: charts/n8n-sandbox-service
      helm:
        releaseName: n8n-sandbox-service
        valueFiles:
          - $values/apps/n8n-sandbox/values.yaml
    - repoURL: http://192.168.1.100:3001/<user>/homelab-gitops.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      # CreateNamespace alone is NOT enough here — the namespace must also carry
      # pod-security.kubernetes.io/enforce=privileged, or the runner StatefulSet
      # is admitted and never produces a pod. Either label it by hand once, or
      # ship a Namespace manifest with the labels in the -extras sibling app.
      - CreateNamespace=true
      - ServerSideApply=true
